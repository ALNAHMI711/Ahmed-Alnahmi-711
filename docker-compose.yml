version: '3.8'

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - appnet

  redis:
    image: redis:7
    restart: always
    networks:
      - appnet

  backend:
    build: .
    restart: on-failure
    env_file:
      - backend/.env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    networks:
      - appnet

  worker:
    build: .
    command: celery -A backend.app.workers.celery_app.celery worker -l info
    depends_on:
      - redis
      - postgres
    networks:
      - appnet

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
    networks:
      - appnet

  freqtrade:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    environment:
      - FREQTRADE_ENV=production
    networks:
      - appnet

volumes:
  db_data:

networks:
  appnet:
    driver: bridge
