name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements.txt pytest ruff mypy pip-audit
      - run: python -m compileall backend execution tests
      - name: Run execution safety tests
        run: PYTHONPATH=. python -m pytest -q tests/test_reconciliation_races.py tests/test_conditional_risk_reconciliation.py tests/test_tp_sl_reconciliation_safety.py tests/test_tp_sl_mapping.py
      - name: Ruff strict audit
        run: ruff check backend modules risk signals tests
      - run: mypy --ignore-missing-imports backend
      - run: PYTHONPATH=. python -m pytest -q
      - run: pip-audit -r requirements.txt
      - run: docker build .
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
